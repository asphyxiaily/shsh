<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>index of /blobs/</title>
<style>
  body {
    font-family: monospace;
    font-size: 14px;
    background: #ffffff;
    color: #000;
    margin: 0;
    padding: 20px;
  }

  h1 {
    font-weight: normal;
    font-size: 20px;
    margin-bottom: 10px;
  }

  hr {
    border: none;
    border-top: 1px solid #ccc;
    margin: 10px 0;
  }

  a {
    color: #00f;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th, td {
    text-align: left;
    padding: 2px 10px 2px 0;
    white-space: nowrap;
  }

  th {
    font-weight: normal;
  }

  .footer {
    margin-top: 20px;
    font-size: 12px;
    color: #666;
  }
</style>
</head>
<body>

<h1>index of /blobs/</h1>
<hr>

<table id="fileTable">
  <thead>
    <tr>
      <th>name</th>
      <th>last modified</th>
      <th>size</th>
    </tr>
  </thead>
  <tbody>
    <tr><td colspan="3">wait...</td></tr>
  </tbody>
</table>

<hr>

<div class="footer">
  balls
</div>

<script>
fetch('list.json')
  .then(response => response.json())
  .then(files => {
    const tbody = document.querySelector('#fileTable tbody');
    tbody.innerHTML = '';

    const parentRow = document.createElement('tr');
    parentRow.innerHTML = `
      <td><a href="../">../</a></td>
      <td></td>
      <td></td>
    `;
    tbody.appendChild(parentRow);

    files.forEach(file => {
      const tr = document.createElement('tr');

      const name = file.name;
      const date = file.mtime || '-';
      const size = file.size ? formatSize(file.size) : '-';

      tr.innerHTML = `
        <td><a href="blobs/${name}" target="_blank">${name}</a></td>
        <td>${date}</td>
        <td>${size}</td>
      `;

      tbody.appendChild(tr);
    });
  })
  .catch(err => {
    document.querySelector('#fileTable tbody').innerHTML =
      '<tr><td colspan="3">error loading file list</td></tr>';
    console.error(err);
  });

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + 'K';
  if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + 'M';
  return (bytes / 1024 / 1024 / 1024).toFixed(1) + 'G';
}
</script>

</body>
</html>
