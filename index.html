<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>shsh.host — blobs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #2a2a2a;
      --accent: #e8ff47;
      --text: #e0e0e0;
      --muted: #555;
      --hover-bg: #1e1e1e;
      --font-mono: 'IBM Plex Mono', monospace;
      --font-sans: 'IBM Plex Sans', sans-serif;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      min-height: 100vh;
      line-height: 1.5;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 2.5rem 2rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 1rem;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--accent);
    }

    header .slash { color: var(--muted); }

    header .path {
      font-size: 0.9rem;
      color: var(--muted);
    }

    header .desc {
      margin-left: auto;
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .toolbar {
      padding: 0.9rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 1rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .toolbar input {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.82rem;
      padding: 0.45rem 0.8rem;
      outline: none;
      width: 260px;
      transition: border-color 0.2s;
    }

    .toolbar input::placeholder { color: var(--muted); }
    .toolbar input:focus { border-color: var(--accent); }

    #file-count {
      font-size: 0.78rem;
      color: var(--muted);
      margin-left: auto;
    }

    .table-wrap {
      flex: 1;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      padding: 0.6rem 2rem;
      text-align: left;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      user-select: none;
      cursor: pointer;
      white-space: nowrap;
    }

    thead th:hover { color: var(--accent); }

    thead th .sort-icon {
      display: inline-block;
      margin-left: 0.35rem;
      opacity: 0.4;
      transition: opacity 0.15s;
    }

    thead th.active .sort-icon { opacity: 1; color: var(--accent); }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.12s;
    }

    tbody tr:hover { background: var(--hover-bg); }

    tbody td {
      padding: 0.75rem 2rem;
      font-size: 0.85rem;
      vertical-align: middle;
      white-space: nowrap;
    }

    td.name a {
      color: var(--text);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    td.name a:hover { color: var(--accent); }

    td.name .icon {
      font-size: 0.75rem;
      opacity: 0.5;
      flex-shrink: 0;
    }

    td.size { color: var(--muted); font-size: 0.8rem; min-width: 90px; }
    td.ext  { color: var(--muted); font-size: 0.8rem; min-width: 80px; }

    td.dl a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.75rem;
      padding: 0.28rem 0.7rem;
      border: 1px solid var(--border);
      color: var(--muted);
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    td.dl a:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(232,255,71,0.06);
    }

    .empty {
      padding: 4rem 2rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }

    footer {
      padding: 1rem 2rem;
      border-top: 1px solid var(--border);
      font-size: 0.72rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border); }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    @media (max-width: 600px) {
      header, .toolbar, tbody td, thead th { padding-left: 1rem; padding-right: 1rem; }
      td.ext, td.size { display: none; }
    }
  </style>
</head>
<body>

<header>
  <h1>shsh.host</h1>
  <span class="slash">/</span>
  <span class="path">blobs/</span>
  <span class="desc">name says it all lol</span>
</header>

<div class="toolbar">
  <input type="text" id="search" placeholder="filter files…" autocomplete="off" spellcheck="false" />
  <span id="file-count"></span>
</div>

<div class="table-wrap">
  <table id="file-table">
    <thead>
      <tr>
        <th class="active" data-col="name">name <span class="sort-icon">↑</span></th>
        <th data-col="ext">type <span class="sort-icon">↕</span></th>
        <th data-col="size">size <span class="sort-icon">↕</span></th>
        <th style="cursor:default">download</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">no files found</div>
</div>

<footer>
  <span>shsh.host &mdash; static file host</span>
  <span id="footer-count"></span>
</footer>

<script>
  const RAW_FILES = [
    {% assign blobs = site.static_files | where_exp: "f", "f.path contains '/blobs/'" %}
    {% for file in blobs %}
    {
      name: {{ file.name | jsonify }},
      path: {{ file.path | jsonify }},
      ext:  {{ file.extname | downcase | jsonify }},
      size: null
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  function fmtSize(bytes) {
    if (bytes === null || bytes === undefined) return '—';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
  }

  function extIcon(ext) {
    const map = {
      '.zip':'.gz':'.tar': '🗜',
      '.jpg':'.jpeg':'.png':'.gif':'.webp':'.svg': '🖼',
      '.mp4':'.mov':'.mkv':'.avi': '🎬',
      '.mp3':'.wav':'.ogg':'.flac': '🎵',
      '.pdf': '📄',
      '.sh':'.bash': '⚙',
      '.py':'.js':'.ts':'.rb':'.go': '💾',
      '.txt':'.md': '📝',
    };
    for (const [exts, icon] of Object.entries(map)) {
      if (exts.includes(ext)) return icon;
    }
    return '📦';
  }

  let files = [...RAW_FILES];
  let sortCol = 'name';
  let sortAsc = true;

  function sortFiles(col) {
    if (sortCol === col) { sortAsc = !sortAsc; }
    else { sortCol = col; sortAsc = true; }
    render();
    updateSortUI();
  }

  function updateSortUI() {
    document.querySelectorAll('thead th[data-col]').forEach(th => {
      const active = th.dataset.col === sortCol;
      th.classList.toggle('active', active);
      const icon = th.querySelector('.sort-icon');
      if (active) icon.textContent = sortAsc ? '↑' : '↓';
      else icon.textContent = '↕';
    });
  }

  function render() {
    const q = document.getElementById('search').value.toLowerCase();
    let visible = files.filter(f => f.name.toLowerCase().includes(q));

    visible.sort((a, b) => {
      let va = a[sortCol] ?? '', vb = b[sortCol] ?? '';
      if (sortCol === 'size') { va = va ?? -1; vb = vb ?? -1; }
      if (va < vb) return sortAsc ? -1 : 1;
      if (va > vb) return sortAsc ? 1 : -1;
      return 0;
    });

    const tbody = document.getElementById('tbody');
    const empty = document.getElementById('empty');

    if (visible.length === 0) {
      tbody.innerHTML = '';
      empty.style.display = '';
    } else {
      empty.style.display = 'none';
      tbody.innerHTML = visible.map(f => `
        <tr>
          <td class="name">
            <a href="${f.path}" target="_blank" rel="noopener">
              <span class="icon">${extIcon(f.ext)}</span>
              ${escHtml(f.name)}
            </a>
          </td>
          <td class="ext">${f.ext || '—'}</td>
          <td class="size">${fmtSize(f.size)}</td>
          <td class="dl">
            <a href="${f.path}" download="${escHtml(f.name)}">
              ↓ download
            </a>
          </td>
        </tr>
      `).join('');
    }

    document.getElementById('file-count').textContent =
      visible.length === files.length
        ? `${files.length} file${files.length !== 1 ? 's' : ''}`
        : `${visible.length} of ${files.length}`;
    document.getElementById('footer-count').textContent =
      `${files.length} file${files.length !== 1 ? 's' : ''} in /blobs/`;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.getElementById('search').addEventListener('input', render);
  document.querySelectorAll('thead th[data-col]').forEach(th =>
    th.addEventListener('click', () => sortFiles(th.dataset.col))
  );
  render();
</script>
</body>
</html>
